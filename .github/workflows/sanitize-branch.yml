name: Sanitize & Create Clean Branch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Nome del branch pulito da creare o aggiornare'
        required: true
        default: 'main'
  push:
    branches:
      - lovable # Si avvia in automatico a ogni push da Lovable su main (puoi toglierlo se vuoi solo manuale)

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per fare il push del nuovo branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Esegui pulizia e normalizzazione codice
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // 1. Elimina cartella .lovable e file di reporting
          fs.rmSync(".lovable", { recursive: true, force: true });
          fs.rmSync("src/lib/lovable-error-reporting.ts", { force: true });

          // 2. Normalizza package.json
          if (fs.existsSync("package.json")) {
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.devDependencies && pkg.devDependencies["@lovable.dev/vite-tanstack-config"]) {
              delete pkg.devDependencies["@lovable.dev/vite-tanstack-config"];
            }
            // Assicura la presenza del plugin Vite React standard se mancante
            if (!pkg.devDependencies["@vitejs/plugin-react"]) {
              pkg.devDependencies["@vitejs/plugin-react"] = "^5.0.0";
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          }

          // 3. Normalizza vite.config.ts con plugin standard open-source
          if (fs.existsSync("vite.config.ts")) {
            const viteConfigClean = `import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";
          import tsconfigPaths from "vite-tsconfig-paths";
          import { tanstackStart } from "@tanstack/react-start/plugin/vite";

          const pages = process.env["GITHUB_PAGES"] === "1";

          export default defineConfig({
            base: pages ? "/polimapp/" : "/",
            plugins: [
              tanstackStart({
                server: { entry: "server" },
                ...(pages ? { spa: { enabled: true }, router: { basepath: "/polimapp/" } } : {}),
              }),
              react(),
              tailwindcss(),
              tsconfigPaths(),
            ],
            optimizeDeps: {
              include: ["maplibre-gl", "@maplibre/maplibre-gl-leaflet"],
            },
          });
          `;
            fs.writeFileSync("vite.config.ts", viteConfigClean);
          }

          // 4. Pulisci src/routes/__root.tsx
          const rootPath = "src/routes/__root.tsx";
          if (fs.existsSync(rootPath)) {
            let rootContent = fs.readFileSync(rootPath, "utf8");
            // Rimuovi import del reporter
            rootContent = rootContent.replace(/import\s*\{\s*reportLovableError\s*\}\s*from\s*["\x27][^"\x27]+["\x27];?\n?/g, "");
            // Rimuovi la chiamata a reportLovableError
            rootContent = rootContent.replace(/reportLovableError\([^)]*\);?/g, "");
            // Rimuovi il meta tag Twitter Lovable
            rootContent = rootContent.replace(/\{\s*name:\s*["\x27]twitter:site["\x27],\s*content:\s*["\x27]@Lovable["\x27]\s*\},?\n?/g, "");
            fs.writeFileSync(rootPath, rootContent);
          }

          // 5. Pulisci src/components/MapApp.tsx (domini anteprima)
          const mapAppPath = "src/components/MapApp.tsx";
          if (fs.existsSync(mapAppPath)) {
            let mapAppContent = fs.readFileSync(mapAppPath, "utf8");
            mapAppContent = mapAppContent.replace(
              /const isPreview =[\s\S]*?host\.endsWith\("lovableproject-dev\.com"\);/,
              "const isPreview = !import.meta.env.PROD || window.self !== window.top;"
            );
            fs.writeFileSync(mapAppPath, mapAppContent);
          }

          // 6. Pulisci bunfig.toml se presente
          if (fs.existsSync("bunfig.toml")) {
            let bunfig = fs.readFileSync("bunfig.toml", "utf8");
            bunfig = bunfig.replace(/minimumReleaseAgeExcludes\s*=.*?\n/g, "");
            fs.writeFileSync("bunfig.toml", bunfig);
          }

          // 7. Pulisci disclaimer AGENTS.md
          if (fs.existsSync("AGENTS.md")) {
            let agents = fs.readFileSync("AGENTS.md", "utf8");
            agents = agents.replace(/<!-- LOVABLE:BEGIN -->[\s\S]*?<!-- LOVABLE:END -->\n*/g, "");
            fs.writeFileSync("AGENTS.md", agents);
          }
          '

      - name: Configura Git ed effettua il Push sul nuovo branch
        run: |
          TARGET_BRANCH="${{ github.event.inputs.target_branch || 'main' }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Crea o si sposta sul branch pulito
          git checkout -B "$TARGET_BRANCH"

          # Aggiunge tutte le modifiche e le cancellazioni
          git add -A

          # Esegue il commit solo se ci sono differenze effettive
          if git diff --staged --quiet; then
            echo "Nessuna modifica rilevata, il branch è già pulito."
          else
            git commit -m "chore: sanitize and decouple codebase from Lovable artifacts"
            git push origin "$TARGET_BRANCH" --force
            echo "Branch $TARGET_BRANCH aggiornato con successo!"
          fi
